<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>MMORPG 3D Browser</title>
    <style>
        body { margin: 0; background: #050507; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        
        #game-container { position: relative; width: 100vw; height: 100vh; }
        canvas { display: block; width: 100%; height: 100%; }

        /* HUD Stil MMORPG */
        #player-hud { position: absolute; top: 20px; left: 20px; background: rgba(15, 22, 36, 0.9); border: 2px solid #8c6239; border-radius: 6px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; width: 240px; box-shadow: 0 5px 15px rgba(0,0,0,0.8); z-index: 10; }
        .avatar-box { width: 45px; height: 45px; background: radial-gradient(circle, #591616 0%, #1a0505 100%); border: 2px solid #d4af37; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; }
        .stats-box { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        .player-name { font-size: 13px; font-weight: bold; color: #ffd700; text-shadow: 1px 1px #000; }
        
        .bar-container { width: 100%; height: 11px; background: #1a1512; border-radius: 3px; overflow: hidden; position: relative; border: 1px solid #4a3520; }
        .hp-fill { width: 100%; height: 100%; background: #e74c3c; }
        .mp-fill { width: 100%; height: 100%; background: #3498db; }
        .bar-text { position: absolute; width: 100%; height: 100%; top: 0; left: 0; font-size: 8px; text-align: center; line-height: 11px; color: white; font-weight: bold; text-shadow: 1px 1px #000; }

        /* Chat 3D UI */
        #chat-container { position: absolute; bottom: 20px; left: 20px; width: 320px; background: rgba(12, 10, 9, 0.88); border: 2px solid #5c4326; border-radius: 6px; display: flex; flex-direction: column; padding: 8px; z-index: 10; }
        #chat-messages { height: 110px; overflow-y: auto; font-size: 11px; display: flex; flex-direction: column; gap: 4px; margin-bottom: 6px; color: #ddd; }
        #chat-input { background: #1c1613; border: 1px solid #6e4f2c; color: #fff; padding: 6px; border-radius: 4px; font-size: 11px; outline: none; }

        /* Bară Abilități 3D */
        #action-bar { position: absolute; bottom: 20px; right: 20px; display: flex; gap: 10px; background: rgba(20, 15, 12, 0.92); padding: 8px 12px; border: 2px solid #8c6239; border-radius: 8px; z-index: 10; }
        .skill-slot { width: 46px; height: 46px; background: #1b2838; border: 2px solid #5c4326; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; position: relative; transition: 0.2s; }
        .skill-slot:hover { border-color: #ffd700; transform: scale(1.08); }
        .skill-key { position: absolute; bottom: 2px; right: 4px; font-size: 9px; color: #ffd700; font-weight: bold; }
    </style>

    <!-- Import Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="game-container">
        <!-- HUD Profil -->
        <div id="player-hud">
            <div class="avatar-box">🛡️</div>
            <div class="stats-box">
                <span class="player-name" id="ui-name">3D Hero</span>
                <div class="bar-container">
                    <div class="hp-fill" style="width: 100%;"></div>
                    <div class="bar-text">HP: 1000/1000</div>
                </div>
                <div class="bar-container">
                    <div class="mp-fill" style="width: 100%;"></div>
                    <div class="bar-text">MP: 500/500</div>
                </div>
            </div>
        </div>

        <!-- Chat -->
        <div id="chat-container">
            <div id="chat-messages">
                <div style="color: #00ffcc;"><b>[System]:</b> Lumea 3D s-a încărcat! Folosește W, A, S, D pentru mișcare.</div>
            </div>
            <input type="text" id="chat-input" placeholder="Scrie în chat..." autocomplete="off">
        </div>

        <!-- Bară Abilități -->
        <div id="action-bar">
            <div class="skill-slot" title="Sword Attack">⚔️<span class="skill-key">1</span></div>
            <div class="skill-slot" title="Fireball">🔥<span class="skill-key">2</span></div>
            <div class="skill-slot" title="Heal">🧪<span class="skill-key">3</span></div>
            <div class="skill-slot" title="Ultimate">⚡<span class="skill-key">4</span></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        // Scenă 3D
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0f18);

        // Cameră 3D plasată sus-față (vedere izometrică 3D garantat vizibilă)
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 25, 20);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('game-container').appendChild(renderer.domElement);

        // Lumini strălucitoare
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(10, 30, 10);
        scene.add(dirLight);

        // Sol 3D
        const floorGeo = new THREE.PlaneGeometry(80, 80);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e3f20, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        let players = {};
        let monstersMeshes = {};
        let myId = null;
        let myPos = { x: 0, z: 0, speed: 0.35 };

        // Creare Cavaler 3D
        function createKnightMesh(isMe) {
            const group = new THREE.Group();

            const bodyGeo = new THREE.BoxGeometry(1.2, 2, 0.8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: isMe ? 0xe74c3c : 0x3498db });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1;
            group.add(body);

            const headGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xf5cba7 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 2.4;
            group.add(head);

            return group;
        }

        // Creare Monstru 3D
        function createMonsterMesh() {
            const group = new THREE.Group();
            const mGeo = new THREE.BoxGeometry(1.4, 1.4, 1.4);
            const mMat = new THREE.MeshStandardMaterial({ color: 0xc0392b });
            const mesh = new THREE.Mesh(mGeo, mMat);
            mesh.position.y = 0.7;
            group.add(mesh);
            return group;
        }

        socket.on('currentPlayers', (serverPlayers) => {
            players = serverPlayers;
            myId = socket.id;
            
            // Creează mesh-uri pentru toți jucătorii existenți
            for (const id in players) {
                if (!players[id].mesh) {
                    const mesh = createKnightMesh(id === myId);
                    scene.add(mesh);
                    players[id].mesh = mesh;
                }
            }
        });

        socket.on('currentMonsters', (serverMonsters) => {
            for (const id in serverMonsters) {
                const m = serverMonsters[id];
                if (!monstersMeshes[id]) {
                    const mM = createMonsterMesh();
                    mM.position.set((m.x - 300) / 20, 0.5, (m.y - 200) / 20);
                    scene.add(mM);
                    monstersMeshes[id] = mM;
                }
            }
        });

        socket.on('monstersMoved', (serverMonsters) => {
            for (const id in serverMonsters) {
                const m = serverMonsters[id];
                if (monstersMeshes[id]) {
                    monstersMeshes[id].position.x = (m.x - 300) / 20;
                    monstersMeshes[id].position.z = (m.y - 200) / 20;
                }
            }
        });

        socket.on('newPlayer', (data) => {
            players[data.id] = data.player;
            const mesh = createKnightMesh(false);
            scene.add(mesh);
            players[data.id].mesh = mesh;
        });

        socket.on('playerMoved', (data) => {
            if (players[data.id]) {
                players[data.id].x = data.x;
                players[data.id].y = data.y;
                if (players[data.id].mesh) {
                    players[data.id].mesh.position.x = data.x / 20;
                    players[data.id].mesh.position.z = data.y / 20;
                }
            }
        });

        socket.on('disconnect', (id) => {
            if (players[id] && players[id].mesh) {
                scene.remove(players[id].mesh);
                delete players[id];
            }
        });

        const chatInput = document.getElementById('chat-input');
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && chatInput.value.trim() !== '') {
                socket.emit('chatMessage', chatInput.value);
                chatInput.value = '';
            }
        });

        socket.on('chatMessage', (data) => {
            const chatDiv = document.getElementById('chat-messages');
            chatDiv.innerHTML += `<div><b style="color:#ffd700;">[${data.name}]:</b> ${data.message}</div>`;
            chatDiv.scrollTop = chatDiv.scrollHeight;
        });

        const keys = {};
        window.addEventListener('keydown', (e) => {
            if (document.activeElement === chatInput) return;
            keys[e.key] = true;
        });
        window.addEventListener('keyup', (e) => keys[e.key] = false);

        function update() {
            let moved = false;
            if (keys['w'] || keys['W'] || keys['ArrowUp']) { myPos.z -= myPos.speed; moved = true; }
            if (keys['s'] || keys['S'] || keys['ArrowDown']) { myPos.z += myPos.speed; moved = true; }
            if (keys['a'] || keys['A'] || keys['ArrowLeft']) { myPos.x -= myPos.speed; moved = true; }
            if (keys['d'] || keys['D'] || keys['ArrowRight']) { myPos.x += myPos.speed; moved = true; }

            if (myId && players[myId] && players[myId].mesh) {
                players[myId].mesh.position.x = myPos.x;
                players[myId].mesh.position.z = myPos.z;

                // Urmărire cameră 3D fixă de sus
                camera.position.x = myPos.x;
                camera.position.z = myPos.z + 15;
                camera.lookAt(myPos.x, 0, myPos.z);

                if (moved && socket.connected) {
                    socket.emit('playerMovement', { x: myPos.x * 20, y: myPos.z * 20 });
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            update();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
