<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>MMORPG 2D - Monștri & Iteme</title>
    <style>
        body { margin: 0; background: #111; color: white; text-align: center; font-family: sans-serif; }
        canvas { background: #1a1a1a; display: block; margin: 20px auto; border: 2px solid #555; }
        #scoreBoard { font-size: 20px; color: #00ffcc; font-weight: bold; }
    </style>
</head>
<body>
    <h1>MMORPG 2D în Browser</h1>
    <p>Folosește tastele <b>W, A, S, D</b> sau <b>Săgețile</b>. Ferește-te de monștri și adună diamantele!</p>
    <div id="scoreBoard">Scor: 0</div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let players = {};
        let monsters = {};
        let collectibles = {};
        let myId = null;
        let myPos = { x: 400, y: 300, speed: 4 };
        let myScore = 0;

        socket.on('currentPlayers', (serverPlayers) => {
            players = serverPlayers;
            myId = socket.id;
        });

        socket.on('currentMonsters', (serverMonsters) => {
            monsters = serverMonsters;
        });

        socket.on('monstersMoved', (serverMonsters) => {
            monsters = serverMonsters;
        });

        socket.on('currentCollectibles', (serverCollectibles) => {
            collectibles = serverCollectibles;
        });

        socket.on('newPlayer', (data) => {
            players[data.id] = data.player;
        });

        socket.on('playerMoved', (data) => {
            if (players[data.id]) {
                players[data.id].x = data.x;
                players[data.id].y = data.y;
            }
        });

        socket.on('collectibleTaken', (data) => {
            delete collectibles[data.collectibleId];
            if (data.playerId === socket.id) {
                myScore = data.score;
                document.getElementById('scoreBoard').innerText = `Scor: ${myScore}`;
            }
        });

        socket.on('newCollectible', (collectible) => {
            collectibles[collectible.id] = collectible;
        });

        socket.on('disconnect', (id) => {
            delete players[id];
        });

        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.key] = true);
        window.addEventListener('keyup', (e) => keys[e.key] = false);

        function update() {
            let moved = false;
            if (keys['w'] || keys['W'] || keys['ArrowUp']) { myPos.y = Math.max(20, myPos.y - myPos.speed); moved = true; }
            if (keys['s'] || keys['S'] || keys['ArrowDown']) { myPos.y = Math.min(canvas.height - 20, myPos.y + myPos.speed); moved = true; }
            if (keys['a'] || keys['A'] || keys['ArrowLeft']) { myPos.x = Math.max(20, myPos.x - myPos.speed); moved = true; }
            if (keys['d'] || keys['D'] || keys['ArrowRight']) { myPos.x = Math.min(canvas.width - 20, myPos.x + myPos.speed); moved = true; }

            if (moved && socket.connected) {
                socket.emit('playerMovement', { x: myPos.x, y: myPos.y });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.font = "26px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            // Desenează obiectele de colectat (Diamante 2D)
            for (const id in collectibles) {
                const c = collectibles[id];
                ctx.fillText('💎', c.x, c.y);
            }

            // Desenează monștrii 2D (Inamici extratereștri / monștri)
            for (const id in monsters) {
                const m = monsters[id];
                ctx.fillText('👾', m.x, m.y);
            }

            // Desenează jucătorii (Eroii 2D)
            for (const id in players) {
                const p = players[id];
                // Dacă ești tu, afișăm un cavaler/vrăjitor 🧙, altfel alt emoji de erou 🛡️
                const icon = (id === myId) ? '🧙‍♂️' : '🛡️';
                ctx.fillText(icon, p.x, p.y);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
