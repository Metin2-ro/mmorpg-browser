<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>MMORPG Browser</title>
    <style>
        body { margin: 0; background: #111; color: white; text-align: center; font-family: sans-serif; }
        canvas { background: #222; display: block; margin: 20px auto; border: 2px solid #555; }
    </style>
</head>
<body>
    <h1>Joc MMORPG în Browser</h1>
    <p>Folosește tastele <b>W, A, S, D</b> sau <b>Săgețile</b> pentru a te mișca!</p>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let players = {};
        let myId = null;
        let myPos = { x: 400, y: 300, speed: 4 };

        socket.on('currentPlayers', (serverPlayers) => {
            players = serverPlayers;
            myId = socket.id;
        });

        socket.on('newPlayer', (data) => {
            players[data.id] = data.player;
        });

        socket.on('playerMoved', (data) => {
            if (players[data.id]) {
                players[data.id].x = data.x;
                players[data.id].y = data.y;
            }
        });

        socket.on('disconnect', (id) => {
            delete players[id];
        });

        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.key] = true);
        window.addEventListener('keyup', (e) => keys[e.key] = false);

        function update() {
            let moved = false;
            if (keys['w'] || keys['W'] || keys['ArrowUp']) { myPos.y -= myPos.speed; moved = true; }
            if (keys['s'] || keys['S'] || keys['ArrowDown']) { myPos.y += myPos.speed; moved = true; }
            if (keys['a'] || keys['A'] || keys['ArrowLeft']) { myPos.x -= myPos.speed; moved = true; }
            if (keys['d'] || keys['D'] || keys['ArrowRight']) { myPos.x += myPos.speed; moved = true; }

            if (moved && socket.connected) {
                socket.emit('playerMovement', { x: myPos.x, y: myPos.y });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (const id in players) {
                const p = players[id];
                ctx.fillStyle = (id === myId) ? '#ff3333' : (p.color || '#33ccff');
                ctx.beginPath();
                ctx.arc(p.x, p.y, 20, 0, Math.PI * 2);
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
